openapi: 3.0.3
info:
  title: ms_cart · Cart Service (Descubre EC)
  version: 1.0.0
  description: >-
    Contrato propio del microservicio **8 · Cart Service** (REST), derivado de `Plan/ms_cart/ms_cart.sql`, de

    `Plan/arquitectura_esb_v3.html` y de los campos de `CreateReservaRequestV3` del contrato v3.


    ## Alcance

    Carrito del usuario del portal. Booking Prototipo no lo usa.


    ## Compra

    Cada atracción se paga por separado: una transacción compra un solo ítem, y los demás siguen en el carrito.

    `PENDIENTE` → (Order crea la orden) → `EN_PAGO` → (pago aprobado) → `COMPRADO`. Si el pago falla, vuelve a
    `PENDIENTE`.

    Un ítem `EN_PAGO` no se edita ni se quita, y los `COMPRADO` no aparecen en `GET /carrito`.


    ## Precios

    Cart no guarda precios: GraphQL los obtiene de Pricing.


    ## Errores

    RFC 7807 (`application/problem+json`), con el esquema `ProblemDetails` del contrato v3.
servers:
  - url: /api/v3
    description: Ruta canónica v3 detrás del API Gateway y el ESB
  - url: 'http://localhost:4012/api/v3'
    description: Desarrollo local
security:
  - BearerAuth: []
tags:
  - name: Carrito del usuario
    description: El usuario autenticado administra su carrito.
  - name: Compra de un ítem
    description: Rutas internas para Order.
  - name: Salud
    description: Telemetría del nodo.
paths:
  /carrito:
    get:
      tags:
        - Carrito del usuario
      summary: Consultar el carrito activo del usuario
      description: 'Devuelve el carrito activo del usuario del JWT. Si no tiene uno, responde un carrito vacío (`id` null).'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Carrito activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    delete:
      tags:
        - Carrito del usuario
      summary: Vaciar el carrito activo
      description: Quita los ítems `PENDIENTE`. Los ítems `EN_PAGO` se conservan hasta que Order confirme o libere el pago.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Carrito vaciado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /carrito/items:
    post:
      tags:
        - Carrito del usuario
      summary: Agregar una atracción (y opcionalmente un turno) al carrito
      description: |
        Crea el carrito activo si no existe. Si ya hay un ítem con la misma atracción y el mismo `slot_id`,
        reemplaza sus cantidades y responde `200`; si es nuevo responde `201`.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Ítem existente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '201':
          description: Ítem agregado.
          headers:
            Location:
              description: URL del ítem creado.
              schema:
                type: string
                example: /api/v3/carrito/items/57
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/carrito/items/{item_id}':
    parameters:
      - $ref: '#/components/parameters/ItemIdPath'
      - $ref: '#/components/parameters/XCorrelationIdHeader'
    patch:
      tags:
        - Carrito del usuario
      summary: Cambiar cantidades o turno de un ítem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdateRequest'
      responses:
        '200':
          description: Ítem actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    delete:
      tags:
        - Carrito del usuario
      summary: Quitar un ítem del carrito
      responses:
        '200':
          description: Ítem quitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/internal/carrito-items/{item_id}':
    get:
      tags:
        - Compra de un ítem
      summary: Leer un ítem
      description: 'Lo usa Order. `usu_id` debe ser el dueño: si no, `404`.'
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
        - name: usu_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Ítem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/internal/carrito-items/{item_id}/orden':
    post:
      tags:
        - Compra de un ítem
      summary: Ligar el ítem a su orden (PENDIENTE → EN_PAGO)
      description: >-
        Order lo llama al crear la orden. Repetir con la misma clave y orden devuelve `200`. Con otra orden, `409
        CART_ITEM_ALREADY_ORDERED`. Sin turno, `422 SLOT_REQUIRED`.
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemOrderRequest'
      responses:
        '200':
          description: Ítem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/internal/carrito-items/{item_id}/orden/confirmacion':
    post:
      tags:
        - Compra de un ítem
      summary: Confirmar la compra (EN_PAGO → COMPRADO)
      description: Order lo llama tras el pago aprobado. Repetirlo devuelve `200`.
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemOrderRequest'
      responses:
        '200':
          description: Ítem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/internal/carrito-items/{item_id}/orden/liberacion':
    post:
      tags:
        - Compra de un ítem
      summary: Liberar el ítem (EN_PAGO → PENDIENTE)
      description: Order lo llama si el pago se rechaza o la orden se cancela. Repetirlo devuelve `200`.
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemOrderRequest'
      responses:
        '200':
          description: Ítem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /health:
    get:
      tags:
        - Salud
      summary: Salud del nodo ms_cart
      security: []
      responses:
        '200':
          description: Estado del nodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
        '503':
          description: Nodo degradado o sin base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
components:
  parameters:
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  

        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams
        de Apache Kafka.
      schema:
        type: string
      example: cid-8821a-9923
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 de la compra (la misma que Order recibió). Evita ligar el ítem dos veces ante reintentos.
      schema:
        type: string
        format: uuid
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    ItemIdPath:
      name: item_id
      in: path
      required: true
      description: Identificador del ítem (`carrito_item.cai_id`).
      schema:
        type: integer
        format: int64
      example: 57
  schemas:
    CartItemRequest:
      type: object
      required:
        - attraction_id
        - adult_count
      properties:
        attraction_id:
          type: string
          description: ID público o slug de la atracción. Cart guarda siempre el ID público.
          example: PRhu4UBTWPBC
        slot_id:
          type: string
          nullable: true
          pattern: '^slot-[0-9]{8}-[0-9]{4}$'
          description: Turno elegido (`TimeSlotItem.slot_id`). Opcional mientras el usuario no elija fecha y hora.
          example: slot-20261025-1030
        adult_count:
          type: integer
          minimum: 1
          example: 2
        child_count:
          type: integer
          minimum: 0
          default: 0
          example: 1
        senior_count:
          type: integer
          minimum: 0
          default: 0
          example: 0
        student_count:
          type: integer
          minimum: 0
          default: 0
          example: 0
        infant_count:
          type: integer
          minimum: 0
          default: 0
          description: 'Infantes (tarifa $0, pero ocupan cupo).'
          example: 0
    CartItemUpdateRequest:
      type: object
      description: Solo se cambian los campos enviados. Enviar `slot_id` null quita el turno elegido.
      minProperties: 1
      properties:
        slot_id:
          type: string
          nullable: true
          pattern: '^slot-[0-9]{8}-[0-9]{4}$'
          example: slot-20261026-0900
        adult_count:
          type: integer
          minimum: 1
        child_count:
          type: integer
          minimum: 0
        senior_count:
          type: integer
          minimum: 0
        student_count:
          type: integer
          minimum: 0
        infant_count:
          type: integer
          minimum: 0
    CartItem:
      type: object
      required:
        - item_id
        - attraction_id
        - adult_count
        - child_count
        - senior_count
        - student_count
        - infant_count
        - ticket_count
        - status
        - created_at
      properties:
        item_id:
          type: integer
          format: int64
          example: 57
        attraction_id:
          type: string
          example: PRhu4UBTWPBC
        slot_id:
          type: string
          nullable: true
          example: slot-20261025-1030
        date:
          type: string
          format: date
          nullable: true
          description: Fecha del turno (se obtiene del `slot_id`; null si no hay turno).
          example: '2026-10-25'
        time:
          type: string
          nullable: true
          description: Hora del turno en 24 h (se obtiene del `slot_id`; null si no hay turno).
          example: '10:30:00'
        adult_count:
          type: integer
          example: 2
        child_count:
          type: integer
          example: 1
        senior_count:
          type: integer
          example: 0
        student_count:
          type: integer
          example: 0
        infant_count:
          type: integer
          example: 0
        ticket_count:
          type: integer
          description: Suma de todas las cantidades.
          example: 3
        status:
          type: string
          enum:
            - PENDIENTE
            - EN_PAGO
            - COMPRADO
          description: >-
            `PENDIENTE` editable; `EN_PAGO` ligado a una orden mientras se cobra; `COMPRADO` pagado (solo en las rutas
            internas).
          example: PENDIENTE
        external_order_id:
          type: string
          nullable: true
          description: Orden a la que pasó el ítem (`EN_PAGO` o `COMPRADO`); null si está `PENDIENTE`.
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-10-20T14:02:11Z'
    Cart:
      type: object
      required:
        - id
        - active
        - items
        - item_count
        - ticket_count
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: '`carrito.car_id`; null si el usuario aún no tiene carrito.'
          example: 12
        active:
          type: boolean
          description: false solo si el carrito se abandonó. Pagar un ítem no desactiva el carrito.
          example: true
        items:
          type: array
          description: Ítems `PENDIENTE` y `EN_PAGO` (los `COMPRADO` no se muestran).
          items:
            $ref: '#/components/schemas/CartItem'
        item_count:
          type: integer
          example: 1
        ticket_count:
          type: integer
          example: 3
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        _links:
          type: object
          description: Hipermedios HATEOAS.
          properties:
            self:
              type: string
              example: /api/v3/carrito
            items:
              type: string
              example: /api/v3/carrito/items
    CartItemOrderRequest:
      type: object
      required:
        - external_order_id
      properties:
        external_order_id:
          type: string
          description: '`orden.ord_numero` de la orden creada para este ítem (una atracción).'
          example: ORD-DILAN-8721
    NodeHealthResponse:
      type: object
      required:
        - status
        - node_id
        - node_code
        - version
        - database_connected
        - latency_ms
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
          example: UP
        node_id:
          type: string
          example: node-dilan-atracciones-01
        node_code:
          type: string
          example: DILAN_ATRACCIONES
        url_base:
          type: string
          example: 'https://descubreec.com/api/v1'
        version:
          type: string
          example: 2.0.0
        database_connected:
          type: boolean
          example: true
        latency_ms:
          type: integer
          description: Tiempo de respuesta del chequeo interno en milisegundos.
          example: 18
        memory_usage_mb:
          type: number
          example: 142.5
        uptime_seconds:
          type: integer
          example: 86400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI que identifica el tipo de error bajo estándar RFC 7807.
          example: 'https://booking.epn.edu.ec/errors/sin-cupos'
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Cupos Agotados para el Turno Horario
        status:
          type: integer
          description: Código de estado HTTP correspondiente.
          example: 409
        detail:
          type: string
          description: Explicación detallada de la ocurrencia del error.
          example: >-
            No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1,
            solicitados: 2.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v3/atracciones/reservas
        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: OUT_OF_STOCK
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: cid-8821a
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: customer.phone
              reason:
                type: string
                example: El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX).
  responses:
    ProblemDetails400:
      description: JSON inválido o tipos de datos erróneos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: 'Token JWT ausente, expirado o inválido.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: El ítem o el carrito no existe o no pertenece al usuario.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: '`CART_FULL`, `CART_ITEM_IN_PAYMENT`, `CART_ITEM_ALREADY_ORDERED` o `CART_ITEM_NOT_IN_PAYMENT` (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails422:
      description: '`ATTRACTION_NOT_FOUND`, `SLOT_NOT_FOUND`, `SLOT_SOLD_OUT` o `SLOT_REQUIRED` (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servicio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios
        (RDA2 Semana 11).  

        Se transmite en la cabecera `Authorization: Bearer <token>`.
    ServiceTokenAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Secreto compartido por los componentes internos.
