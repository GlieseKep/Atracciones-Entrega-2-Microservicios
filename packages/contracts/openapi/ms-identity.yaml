openapi: 3.0.3
info:
  title: ms_identity · Identity & Access Service (TourGirls)
  version: 1.0.0
  description: >-
    Contrato propio del microservicio **1 · Identity & Access Service** (REST), derivado de la base `ms_identity`

    (`Plan/02_microservicios_v2_bases_de_datos.sql`), de `Plan/arquitectura_esb_v3.html` y de la seguridad del
    contrato

    `Plan/PlanBooking/atracciones-openapi-v3(1).yaml`.


    ## Alcance

    Cuentas de usuario, roles, sesiones, tokens de verificación y clientes API (`X-API-Key` de Booking Prototipo).


    ## Autenticación del sistema

    * El contrato v3 acepta dos credenciales: `Authorization: Bearer <JWT>` (RFC 7519) y `X-API-Key`.

    * Identity emite los JWT y guarda el hash de las claves.

    * El API Gateway llama a Identity para validar cada credencial (`/internal/**`).


    ## Errores

    RFC 7807 (`application/problem+json`), con el esquema `ProblemDetails` del contrato v3.
servers:
  - url: /api/v3
    description: Ruta canónica v3 detrás del API Gateway y el ESB
  - url: 'http://localhost:4018/api/v3'
    description: Desarrollo local
security:
  - BearerAuth: []
tags:
  - name: Autenticación
    description: 'Registro, sesión, verificación del correo y recuperación de contraseña.'
  - name: Perfil
    description: El usuario autenticado.
  - name: Usuarios
    description: Administración de usuarios y roles (rol ADMIN).
  - name: Clientes API
    description: Claves de socios (rol ADMIN).
  - name: Interno
    description: Rutas para el API Gateway y otros servicios.
  - name: Salud
    description: Telemetría del nodo.
paths:
  /auth/registro:
    post:
      tags:
        - Autenticación
      summary: Crear una cuenta de cliente
      description: Asigna el rol CLIENTE y crea un token de verificación de tipo EMAIL.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Crea una `sesion` y actualiza `usu_ultimo_acceso`. El mismo error cubre correo y contraseña incorrectos.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
                - password
              properties:
                correo:
                  type: string
                  format: email
                  maxLength: 160
                password:
                  type: string
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renovar la sesión
      description: 'Revoca la sesión usada y crea otra: cada refresh token sirve una sola vez.'
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Sesión renovada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar la sesión actual
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /auth/verificacion-correo:
    post:
      tags:
        - Autenticación
      summary: Confirmar el correo
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '204':
          description: Correo verificado.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /auth/verificacion-correo/reenvio:
    post:
      tags:
        - Autenticación
      summary: Reenviar la verificación del correo
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '202':
          description: Solicitud aceptada.
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /auth/recuperacion:
    post:
      tags:
        - Autenticación
      summary: Pedir la recuperación de contraseña
      description: 'Responde `202` aunque el correo no exista, para no revelar qué cuentas hay.'
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
              properties:
                correo:
                  type: string
                  format: email
                  maxLength: 160
      responses:
        '202':
          description: Solicitud aceptada.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /auth/recuperacion/confirmar:
    post:
      tags:
        - Autenticación
      summary: Definir una contraseña nueva
      description: Marca el token como usado y revoca todas las sesiones del usuario.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
      responses:
        '204':
          description: Contraseña actualizada.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /usuarios/me:
    get:
      tags:
        - Perfil
      summary: Mi perfil
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    patch:
      tags:
        - Perfil
      summary: Actualizar mi perfil
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilUpdateRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /usuarios/me/password:
    put:
      tags:
        - Perfil
      summary: Cambiar mi contraseña
      description: Revoca las demás sesiones.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password_actual
                - password_nuevo
              properties:
                password_actual:
                  type: string
                password_nuevo:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
      responses:
        '204':
          description: Contraseña cambiada.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: rol
          in: query
          required: false
          schema:
            type: string
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPage'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/usuarios/{id}':
    get:
      tags:
        - Usuarios
      summary: Obtener un usuario
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`usuario.usu_id`.'
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/usuarios/{id}/activo':
    put:
      tags:
        - Usuarios
      summary: Activar o desactivar un usuario
      description: Desactivar revoca sus sesiones. Un administrador no puede desactivarse a sí mismo.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`usuario.usu_id`.'
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - activo
              properties:
                activo:
                  type: boolean
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/usuarios/{id}/roles':
    post:
      tags:
        - Usuarios
      summary: Asignar un rol
      description: '`usr_asignado_por` es el administrador autenticado.'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`usuario.usu_id`.'
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rol
              properties:
                rol:
                  $ref: '#/components/schemas/RolNombre'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/usuarios/{id}/roles/{rol}':
    delete:
      tags:
        - Usuarios
      summary: Quitar un rol
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`usuario.usu_id`.'
          schema:
            type: integer
            format: int64
        - name: rol
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RolNombre'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /roles:
    get:
      tags:
        - Usuarios
      summary: Listar roles activos
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /clientes-api:
    get:
      tags:
        - Clientes API
      summary: Listar clientes API
      description: Nunca devuelve la clave.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Clientes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteApi'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    post:
      tags:
        - Clientes API
      summary: Crear un cliente API
      description: La clave se muestra **solo en esta respuesta**; se guarda su SHA-256.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo
                - nombre
              properties:
                codigo:
                  type: string
                  maxLength: 60
                  example: BOOKING_PROTOTIPO
                nombre:
                  type: string
                  maxLength: 150
      responses:
        '201':
          description: Cliente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteApiCreado'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/clientes-api/{id}/activo':
    put:
      tags:
        - Clientes API
      summary: Activar o desactivar un cliente API
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`cliente_api.cla_id`.'
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - activo
              properties:
                activo:
                  type: boolean
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteApi'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /internal/tokens/validar:
    post:
      tags:
        - Interno
      summary: Validar un JWT
      description: 'Comprueba firma, expiración, sesión no revocada y usuario activo.'
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /internal/api-keys/validar:
    post:
      tags:
        - Interno
      summary: Validar una X-API-Key
      description: 'Busca por SHA-256, exige `cla_activo` y actualiza `cla_ultimo_uso`.'
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
              properties:
                api_key:
                  type: string
      responses:
        '200':
          description: Credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /internal/usuarios/lote:
    post:
      tags:
        - Interno
      summary: Obtener varios usuarios por ID
      description: Para los servicios que guardan `usu_id` como ID lógico. Los IDs que no existen se omiten.
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  minItems: 1
                  maxItems: 200
      responses:
        '200':
          description: Usuarios encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResumen'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /health:
    get:
      tags:
        - Salud
      summary: Salud del nodo ms_identity
      security: []
      responses:
        '200':
          description: Estado del nodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
        '503':
          description: Nodo degradado o sin base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
components:
  parameters:
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  

        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams
        de Apache Kafka.
      schema:
        type: string
      example: cid-8821a-9923
  schemas:
    RolNombre:
      type: string
      enum:
        - ADMIN
        - OPERADOR
        - CLIENTE
    Rol:
      type: object
      required:
        - id
        - nombre
        - descripcion
      properties:
        id:
          type: integer
        nombre:
          $ref: '#/components/schemas/RolNombre'
        descripcion:
          type: string
    RegistroRequest:
      type: object
      required:
        - correo
        - password
        - nombre
        - apellido
        - documento
      properties:
        correo:
          type: string
          format: email
          maxLength: 160
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        nombre:
          type: string
          maxLength: 120
        apellido:
          type: string
          maxLength: 120
        documento:
          type: string
          maxLength: 20
          description: Cédula ecuatoriana válida o pasaporte (6 a 9 letras o dígitos). Después solo lo cambia un administrador.
        telefono:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
          nullable: true
        fecha_nacimiento:
          type: string
          format: date
          nullable: true
    PerfilUpdateRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 120
        apellido:
          type: string
          maxLength: 120
        documento:
          type: string
          maxLength: 20
          description: Solo en `PATCH /usuarios/{id}` (ADMIN); no puede quedar vacío. En `PATCH /usuarios/me` enviarlo responde 400.
        telefono:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
          nullable: true
        fecha_nacimiento:
          type: string
          format: date
          nullable: true
        avatar:
          type: string
          maxLength: 255
          nullable: true
      description: Los campos que no se envían conservan su valor. El correo no se cambia aquí.
    Usuario:
      type: object
      required:
        - id
        - correo
        - nombre
        - apellido
        - verificado
        - activo
        - roles
        - creado_en
        - actualizado_en
      properties:
        id:
          type: integer
          format: int64
        correo:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        documento:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        fecha_nacimiento:
          type: string
          format: date
          nullable: true
        avatar:
          type: string
          nullable: true
        verificado:
          type: boolean
        activo:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolNombre'
        ultimo_acceso:
          type: string
          format: date-time
          nullable: true
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time
    UsuarioResumen:
      type: object
      required:
        - id
        - nombre
        - apellido
        - correo
        - activo
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
        activo:
          type: boolean
    UsuarioPage:
      type: object
      required:
        - metadata
        - data
      properties:
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
    SesionResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - usuario
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Segundos de vida del JWT.
        refresh_token:
          type: string
        usuario:
          $ref: '#/components/schemas/Usuario'
    Principal:
      type: object
      required:
        - tipo
        - id
        - nombre
        - roles
      properties:
        tipo:
          type: string
          enum:
            - USUARIO
            - CLIENTE_API
        id:
          type: integer
          format: int64
        nombre:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolNombre'
          description: Vacío para un cliente API.
    ClienteApi:
      type: object
      required:
        - id
        - codigo
        - nombre
        - activo
        - creado_en
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
        ultimo_uso:
          type: string
          format: date-time
          nullable: true
    ClienteApiCreado:
      allOf:
        - $ref: '#/components/schemas/ClienteApi'
        - type: object
          required:
            - api_key
          properties:
            api_key:
              type: string
              description: Se muestra una sola vez.
    PaginationMetadata:
      type: object
      required:
        - total_results
        - page
        - limit
        - total_pages
      properties:
        total_results:
          type: integer
          example: 32
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_pages:
          type: integer
          example: 4
        next_cursor:
          type: string
          nullable: true
          example: eyJvZmZzZXQiOjEwfQ==
    NodeHealthResponse:
      type: object
      required:
        - status
        - node_id
        - node_code
        - version
        - database_connected
        - latency_ms
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
          example: UP
        node_id:
          type: string
          example: node-dilan-atracciones-01
        node_code:
          type: string
          example: DILAN_ATRACCIONES
        url_base:
          type: string
          example: 'https://tourgirls.com/api/v1'
        version:
          type: string
          example: 2.0.0
        database_connected:
          type: boolean
          example: true
        latency_ms:
          type: integer
          description: Tiempo de respuesta del chequeo interno en milisegundos.
          example: 18
        memory_usage_mb:
          type: number
          example: 142.5
        uptime_seconds:
          type: integer
          example: 86400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI que identifica el tipo de error bajo estándar RFC 7807.
          example: 'https://booking.epn.edu.ec/errors/sin-cupos'
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Cupos Agotados para el Turno Horario
        status:
          type: integer
          description: Código de estado HTTP correspondiente.
          example: 409
        detail:
          type: string
          description: Explicación detallada de la ocurrencia del error.
          example: >-
            No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1,
            solicitados: 2.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v3/atracciones/reservas
        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: OUT_OF_STOCK
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: cid-8821a
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: customer.phone
              reason:
                type: string
                example: El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX).
  responses:
    ProblemDetails400:
      description: 'Parámetros inválidos, o token de verificación inválido, vencido o ya usado (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: 'No autenticado. Credenciales inválidas o token ausente, vencido o revocado (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: Acceso denegado. Cuenta desactivada o rol insuficiente (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: No encontrado (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: >-
        Conflicto: `EMAIL_ALREADY_EXISTS`, `DOCUMENT_ALREADY_EXISTS`, `ROLE_ALREADY_ASSIGNED`, `CLIENT_CODE_EXISTS` o
        `CANNOT_DISABLE_SELF` (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servicio (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios
        (RDA2 Semana 11).  

        Se transmite en la cabecera `Authorization: Bearer <token>`.
    ServiceTokenAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: 'Secreto compartido por los componentes internos (API Gateway, ESB y servicios).'
