openapi: 3.0.3
info:
  title: ms_invoicing · Electronic Invoicing Service (Descubre EC)
  version: 1.0.0
  description: >-
    Contrato de consulta del microservicio **14 · Electronic Invoicing Service**, derivado de la base `ms_invoicing`

    (`Plan/02_microservicios_v2_bases_de_datos.sql`) y de `Plan/arquitectura_esb_v3.html`.


    ## Alcance

    La emisión no tiene ruta: empieza con el evento `OrdenPagada`, y el comprobante se envía al SRI por SOAP desde una
    cola. Este contrato

    solo cubre la consulta. El servicio es cliente SOAP: no publica un WSDL propio.


    ## Eventos

    Publica `FacturaAutorizada`.


    ## Errores

    RFC 7807 (`application/problem+json`), con el esquema `ProblemDetails` del contrato v3.
servers:
  - url: /api/v3
    description: Ruta canónica v3 detrás del API Gateway y el ESB
  - url: 'http://localhost:4021/api/v3'
    description: Desarrollo local
security:
  - BearerAuth: []
  - ServiceTokenAuth: []
tags:
  - name: Facturas
    description: Consulta de facturas.
  - name: Salud
    description: Telemetría del nodo.
paths:
  /facturas:
    get:
      tags:
        - Facturas
      summary: Listar facturas
      description: Rol ADMIN.
      security:
        - BearerAuth: []
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - NO_PAGADA
              - PAGADA
              - ANULADA
        - name: estado_sri
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDIENTE
              - AUTORIZADA
              - RECHAZADA
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de facturas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaPage'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/facturas/{id}':
    get:
      tags:
        - Facturas
      summary: Obtener una factura con su detalle
      security:
        - BearerAuth: []
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`factura.fac_id`.'
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Factura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaDetalle'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/facturas/orden/{ord_id}':
    get:
      tags:
        - Facturas
      summary: Factura de una orden
      description: Cuenta de servicio o rol ADMIN. El portal la pide después de que Order verifica al dueño.
      security:
        - BearerAuth: []
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: ord_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Factura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaDetalle'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /health:
    get:
      tags:
        - Salud
      summary: Salud del nodo ms_invoicing
      security: []
      responses:
        '200':
          description: Estado del nodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
        '503':
          description: Nodo degradado o sin base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
components:
  parameters:
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  

        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams
        de Apache Kafka.
      schema:
        type: string
      example: cid-8821a-9923
  schemas:
    Factura:
      type: object
      required:
        - id
        - ord_id
        - numero
        - estado
        - estado_sri
        - emitida_en
        - subtotal
        - descuento
        - iva
        - total
        - tipo_identificacion
        - identificacion
        - razon_social
        - correo
      properties:
        id:
          type: integer
          format: int64
        ord_id:
          type: integer
          format: int64
        dfa_id:
          type: integer
          format: int64
          nullable: true
        numero:
          type: string
          example: 001-001-000000001
        clave_acceso:
          type: string
          nullable: true
        autorizacion_sri:
          type: string
          nullable: true
        estado:
          type: string
          enum:
            - NO_PAGADA
            - PAGADA
            - ANULADA
        estado_sri:
          type: string
          enum:
            - PENDIENTE
            - AUTORIZADA
            - RECHAZADA
        mensaje_sri:
          type: string
          nullable: true
        emitida_en:
          type: string
          format: date-time
        subtotal:
          type: number
        descuento:
          type: number
        iva:
          type: number
        total:
          type: number
        tipo_identificacion:
          type: string
        identificacion:
          type: string
        razon_social:
          type: string
        correo:
          type: string
        telefono:
          type: string
          nullable: true
    FacturaLinea:
      type: object
      required:
        - det_id
        - codigo
        - descripcion
        - cantidad
        - precio_unitario
        - descuento
        - subtotal
        - iva_porcentaje
        - iva
        - total
      properties:
        det_id:
          type: integer
          format: int64
        codigo:
          type: string
        descripcion:
          type: string
        cantidad:
          type: integer
        precio_unitario:
          type: number
        descuento:
          type: number
        subtotal:
          type: number
        iva_porcentaje:
          type: number
        iva:
          type: number
        total:
          type: number
    FacturaDetalle:
      allOf:
        - $ref: '#/components/schemas/Factura'
        - type: object
          required:
            - detalle
          properties:
            detalle:
              type: array
              items:
                $ref: '#/components/schemas/FacturaLinea'
    FacturaPage:
      type: object
      required:
        - metadata
        - data
      properties:
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Factura'
    PaginationMetadata:
      type: object
      required:
        - total_results
        - page
        - limit
        - total_pages
      properties:
        total_results:
          type: integer
          example: 32
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_pages:
          type: integer
          example: 4
        next_cursor:
          type: string
          nullable: true
          example: eyJvZmZzZXQiOjEwfQ==
    NodeHealthResponse:
      type: object
      required:
        - status
        - node_id
        - node_code
        - version
        - database_connected
        - latency_ms
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
          example: UP
        node_id:
          type: string
          example: node-dilan-atracciones-01
        node_code:
          type: string
          example: DILAN_ATRACCIONES
        url_base:
          type: string
          example: 'https://descubreec.com/api/v1'
        version:
          type: string
          example: 2.0.0
        database_connected:
          type: boolean
          example: true
        latency_ms:
          type: integer
          description: Tiempo de respuesta del chequeo interno en milisegundos.
          example: 18
        memory_usage_mb:
          type: number
          example: 142.5
        uptime_seconds:
          type: integer
          example: 86400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI que identifica el tipo de error bajo estándar RFC 7807.
          example: 'https://booking.epn.edu.ec/errors/sin-cupos'
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Cupos Agotados para el Turno Horario
        status:
          type: integer
          description: Código de estado HTTP correspondiente.
          example: 409
        detail:
          type: string
          description: Explicación detallada de la ocurrencia del error.
          example: >-
            No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1,
            solicitados: 2.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v3/atracciones/reservas
        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: OUT_OF_STOCK
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: cid-8821a
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: customer.phone
              reason:
                type: string
                example: El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX).
  responses:
    ProblemDetails400:
      description: Parámetros inválidos (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autenticado (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: Sin permiso (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: '`INVOICE_NOT_FOUND` (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servicio (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios
        (RDA2 Semana 11).  

        Se transmite en la cabecera `Authorization: Bearer <token>`.
    ServiceTokenAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Secreto compartido por los componentes internos.
