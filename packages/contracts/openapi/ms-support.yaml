openapi: 3.0.3
info:
  title: ms_support · Support Service (TourGirls)
  version: 1.0.0
  description: |-
    Contrato propio del microservicio **15 · Support Service** (REST), derivado de la base `ms_support`
    (`Plan/02_microservicios_v2_bases_de_datos.sql`) y de `Plan/arquitectura_esb_v3.html`.

    ## Alcance
    Mensajes de contacto de los visitantes. Sin referencias externas ni eventos.

    ## Errores
    RFC 7807 (`application/problem+json`), con el esquema `ProblemDetails` del contrato v3.
servers:
  - url: /api/v3
    description: Ruta canónica v3 detrás del API Gateway y el ESB
  - url: 'http://localhost:4017/api/v3'
    description: Desarrollo local
security:
  - BearerAuth: []
tags:
  - name: Mensajes
    description: Formulario público.
  - name: Administración
    description: Solo `ADMIN`.
  - name: Salud
    description: Telemetría del nodo.
paths:
  /mensajes-contacto:
    post:
      tags:
        - Mensajes
      summary: Enviar un mensaje
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MensajeRequest'
      responses:
        '201':
          description: Mensaje recibido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeRecibido'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    get:
      tags:
        - Administración
      summary: Listar mensajes
      description: 'Más recientes primero. Con `leido=false`, `total_results` es la cantidad sin leer.'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: leido
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Mensajes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajePage'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/mensajes-contacto/{id}/leido':
    put:
      tags:
        - Administración
      summary: Marcar como leído o no leído
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`men_id`.'
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - leido
              properties:
                leido:
                  type: boolean
      responses:
        '200':
          description: Mensaje actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /health:
    get:
      tags:
        - Salud
      summary: Salud del nodo ms_support
      security: []
      responses:
        '200':
          description: Estado del nodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
        '503':
          description: Nodo degradado o sin base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
components:
  parameters:
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  

        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams
        de Apache Kafka.
      schema:
        type: string
      example: cid-8821a-9923
  schemas:
    MensajeRequest:
      type: object
      required:
        - nombre
        - correo
        - asunto
        - cuerpo
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 160
        asunto:
          type: string
          minLength: 1
          maxLength: 30
        cuerpo:
          type: string
          minLength: 1
          maxLength: 2000
    MensajeRecibido:
      type: object
      required:
        - id
        - creado_en
      properties:
        id:
          type: integer
          format: int64
        creado_en:
          type: string
          format: date-time
    Mensaje:
      type: object
      required:
        - id
        - nombre
        - correo
        - asunto
        - cuerpo
        - leido
        - creado_en
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        correo:
          type: string
        asunto:
          type: string
        cuerpo:
          type: string
        leido:
          type: boolean
        creado_en:
          type: string
          format: date-time
    MensajePage:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Mensaje'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    PaginationMetadata:
      type: object
      required:
        - total_results
        - page
        - limit
        - total_pages
      properties:
        total_results:
          type: integer
          example: 32
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_pages:
          type: integer
          example: 4
        next_cursor:
          type: string
          nullable: true
          example: eyJvZmZzZXQiOjEwfQ==
    NodeHealthResponse:
      type: object
      required:
        - status
        - node_id
        - node_code
        - version
        - database_connected
        - latency_ms
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
          example: UP
        node_id:
          type: string
          example: node-dilan-atracciones-01
        node_code:
          type: string
          example: DILAN_ATRACCIONES
        url_base:
          type: string
          example: 'https://tourgirls.com/api/v1'
        version:
          type: string
          example: 2.0.0
        database_connected:
          type: boolean
          example: true
        latency_ms:
          type: integer
          description: Tiempo de respuesta del chequeo interno en milisegundos.
          example: 18
        memory_usage_mb:
          type: number
          example: 142.5
        uptime_seconds:
          type: integer
          example: 86400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI que identifica el tipo de error bajo estándar RFC 7807.
          example: 'https://booking.epn.edu.ec/errors/sin-cupos'
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Cupos Agotados para el Turno Horario
        status:
          type: integer
          description: Código de estado HTTP correspondiente.
          example: 409
        detail:
          type: string
          description: Explicación detallada de la ocurrencia del error.
          example: >-
            No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1,
            solicitados: 2.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v3/atracciones/reservas
        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: OUT_OF_STOCK
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: cid-8821a
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: customer.phone
              reason:
                type: string
                example: El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX).
  responses:
    ProblemDetails400:
      description: Datos inválidos (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autenticado (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: Se requiere el rol `ADMIN` (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: '`MESSAGE_NOT_FOUND` (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servicio (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios
        (RDA2 Semana 11).  

        Se transmite en la cabecera `Authorization: Bearer <token>`.
