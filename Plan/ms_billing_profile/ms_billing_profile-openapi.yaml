openapi: 3.0.3
info:
  title: ms_billing_profile · Billing Profile Service (Descubre EC)
  version: 1.0.0
  description: >-
    Contrato propio del microservicio **2 · Billing Profile Service** (REST), derivado de la base `ms_billing_profile`

    (`Plan/02_microservicios_v2_bases_de_datos.sql`) y de `Plan/arquitectura_esb_v3.html`.


    ## Alcance

    Datos de facturación de cada usuario. Un usuario puede tener varios perfiles, y uno principal. Invoicing los lee
    para la factura.


    ## Errores

    RFC 7807 (`application/problem+json`), con el esquema `ProblemDetails` del contrato v3.
servers:
  - url: /api/v3
    description: Ruta canónica v3 detrás del API Gateway y el ESB
  - url: 'http://localhost:4013/api/v3'
    description: Desarrollo local
security:
  - BearerAuth: []
tags:
  - name: Mis datos de facturación
    description: El usuario autenticado administra sus perfiles.
  - name: Interno
    description: Rutas para Invoicing.
  - name: Salud
    description: Telemetría del nodo.
paths:
  /usuarios/me/datos-facturacion:
    get:
      tags:
        - Mis datos de facturación
      summary: Listar mis perfiles activos
      description: El principal va primero.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Perfiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatoFacturacion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    post:
      tags:
        - Mis datos de facturación
      summary: Crear un perfil
      description: >-
        El primero queda como principal. Si existe uno inactivo con el mismo tipo y número, se reactiva con los datos
        nuevos.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatoFacturacionRequest'
      responses:
        '201':
          description: Perfil creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatoFacturacion'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/usuarios/me/datos-facturacion/{id}':
    put:
      tags:
        - Mis datos de facturación
      summary: Reemplazar un perfil
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`dato_facturacion.dfa_id`.'
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatoFacturacionRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatoFacturacion'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    delete:
      tags:
        - Mis datos de facturación
      summary: Desactivar un perfil
      description: 'Borrado lógico. Si era el principal, el activo más reciente pasa a serlo.'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`dato_facturacion.dfa_id`.'
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Perfil desactivado.
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/usuarios/me/datos-facturacion/{id}/principal':
    put:
      tags:
        - Mis datos de facturación
      summary: Marcar un perfil como principal
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`dato_facturacion.dfa_id`.'
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Perfil principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatoFacturacion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/internal/usuarios/{usu_id}/datos-facturacion/principal':
    get:
      tags:
        - Interno
      summary: Perfil principal de un usuario
      description: Lo usa Invoicing. `404` si el usuario no tiene perfil.
      security:
        - ServiceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: usu_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Perfil principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatoFacturacion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /health:
    get:
      tags:
        - Salud
      summary: Salud del nodo ms_billing_profile
      security: []
      responses:
        '200':
          description: Estado del nodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
        '503':
          description: Nodo degradado o sin base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
components:
  parameters:
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  

        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams
        de Apache Kafka.
      schema:
        type: string
      example: cid-8821a-9923
  schemas:
    TipoIdentificacion:
      type: string
      enum:
        - CEDULA
        - RUC
        - PASAPORTE
        - CONSUMIDOR_FINAL
    DatoFacturacionRequest:
      type: object
      required:
        - tipo_identificacion
        - identificacion
        - razon_social
        - correo
      properties:
        tipo_identificacion:
          $ref: '#/components/schemas/TipoIdentificacion'
        identificacion:
          type: string
          maxLength: 20
        razon_social:
          type: string
          maxLength: 150
        correo:
          type: string
          format: email
          maxLength: 160
        telefono:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
          nullable: true
        es_principal:
          type: boolean
          default: false
    DatoFacturacion:
      type: object
      required:
        - id
        - usu_id
        - tipo_identificacion
        - identificacion
        - razon_social
        - correo
        - es_principal
        - activo
        - creado_en
      properties:
        id:
          type: integer
          format: int64
        usu_id:
          type: integer
          format: int64
        tipo_identificacion:
          $ref: '#/components/schemas/TipoIdentificacion'
        identificacion:
          type: string
        razon_social:
          type: string
        correo:
          type: string
        telefono:
          type: string
          nullable: true
        es_principal:
          type: boolean
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
    NodeHealthResponse:
      type: object
      required:
        - status
        - node_id
        - node_code
        - version
        - database_connected
        - latency_ms
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
          example: UP
        node_id:
          type: string
          example: node-dilan-atracciones-01
        node_code:
          type: string
          example: DILAN_ATRACCIONES
        url_base:
          type: string
          example: 'https://descubreec.com/api/v1'
        version:
          type: string
          example: 2.0.0
        database_connected:
          type: boolean
          example: true
        latency_ms:
          type: integer
          description: Tiempo de respuesta del chequeo interno en milisegundos.
          example: 18
        memory_usage_mb:
          type: number
          example: 142.5
        uptime_seconds:
          type: integer
          example: 86400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI que identifica el tipo de error bajo estándar RFC 7807.
          example: 'https://booking.epn.edu.ec/errors/sin-cupos'
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Cupos Agotados para el Turno Horario
        status:
          type: integer
          description: Código de estado HTTP correspondiente.
          example: 409
        detail:
          type: string
          description: Explicación detallada de la ocurrencia del error.
          example: >-
            No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1,
            solicitados: 2.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v3/atracciones/reservas
        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: OUT_OF_STOCK
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: cid-8821a
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: customer.phone
              reason:
                type: string
                example: El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX).
  responses:
    ProblemDetails400:
      description: Datos inválidos según el tipo de identificación (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autenticado (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: '`BILLING_PROFILE_NOT_FOUND` (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: '`BILLING_PROFILE_EXISTS`: ya tiene un perfil activo con ese tipo y número (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servicio (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios
        (RDA2 Semana 11).  

        Se transmite en la cabecera `Authorization: Bearer <token>`.
    ServiceTokenAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Secreto compartido por los componentes internos.
