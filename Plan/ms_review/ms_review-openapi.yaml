openapi: 3.0.3
info:
  title: ms_review · Review Service (Descubre EC)
  version: 1.0.0
  description: >-
    Contrato propio del microservicio **5 · Review Service** (REST), derivado de la base `ms_review`

    (`Plan/02_microservicios_v2_bases_de_datos.sql`) y de `Plan/arquitectura_esb_v3.html`.


    ## Alcance

    Reseñas de atracciones, en escala de 1 a 10. El contrato v3 no publica rutas de reseñas: expone `score`,
    `review_count` y

    `breakdown` desde Catalog, que los recibe por el evento `RESENA_PUBLICADA`.


    ## Errores

    RFC 7807 (`application/problem+json`), con el esquema `ProblemDetails` del contrato v3.
servers:
  - url: /api/v3
    description: Ruta canónica v3 detrás del API Gateway y el ESB
  - url: 'http://localhost:4015/api/v3'
    description: Desarrollo local
security:
  - BearerAuth: []
tags:
  - name: Reseñas
    description: Lectura pública y creación.
  - name: Mis reseñas
    description: El usuario autenticado.
  - name: Moderación
    description: Solo `ADMIN`.
  - name: Salud
    description: Telemetría del nodo.
paths:
  '/atracciones/{id}/resenas':
    get:
      tags:
        - Reseñas
      summary: Listar las reseñas visibles
      description: Más recientes primero.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: 'ID público o slug de la atracción, como en el contrato v3.'
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Reseñas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resena'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    post:
      tags:
        - Reseñas
      summary: Crear mi reseña
      description: Una por usuario y atracción. Queda visible y publica `RESENA_PUBLICADA`.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: 'ID público o slug de la atracción, como en el contrato v3.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaRequest'
      responses:
        '201':
          description: Reseña creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resena'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/atracciones/{id}/resenas/anonimas':
    post:
      tags:
        - Reseñas
      summary: Crear una reseña anónima
      description: Sin sesión. Queda oculta hasta que un administrador la apruebe.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: 'ID público o slug de la atracción, como en el contrato v3.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaAnonimaRequest'
      responses:
        '201':
          description: Reseña recibida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resena'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /usuarios/me/resenas:
    get:
      tags:
        - Mis reseñas
      summary: Listar mis reseñas
      description: Incluye las ocultas.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Reseñas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resena'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/usuarios/me/resenas/{id}':
    put:
      tags:
        - Mis reseñas
      summary: Editar mi reseña
      description: 'Una reseña oculta sigue oculta. Si está visible, publica `RESENA_PUBLICADA`.'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`resena.ren_id`.'
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaRequest'
      responses:
        '200':
          description: Reseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resena'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /admin/resenas:
    get:
      tags:
        - Moderación
      summary: Listar reseñas para moderar
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: visible
          in: query
          required: false
          schema:
            type: boolean
        - name: atr_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Reseñas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resena'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/admin/resenas/{id}/visibilidad':
    put:
      tags:
        - Moderación
      summary: Aprobar u ocultar una reseña
      description: 'Si el valor cambia, publica `RESENA_PUBLICADA` con los promedios recalculados.'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          description: '`resena.ren_id`.'
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - visible
              properties:
                visible:
                  type: boolean
      responses:
        '200':
          description: Reseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resena'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /health:
    get:
      tags:
        - Salud
      summary: Salud del nodo ms_review
      security: []
      responses:
        '200':
          description: Estado del nodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
        '503':
          description: Nodo degradado o sin base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
components:
  parameters:
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  

        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams
        de Apache Kafka.
      schema:
        type: string
      example: cid-8821a-9923
  schemas:
    ResenaRequest:
      type: object
      required:
        - puntuacion
        - limpieza
        - servicio
        - calidad_precio
        - puntualidad
        - comentario
      properties:
        puntuacion:
          type: integer
          minimum: 1
          maximum: 10
        limpieza:
          type: integer
          minimum: 1
          maximum: 10
        servicio:
          type: integer
          minimum: 1
          maximum: 10
        calidad_precio:
          type: integer
          minimum: 1
          maximum: 10
        puntualidad:
          type: integer
          minimum: 1
          maximum: 10
        comentario:
          type: string
          minLength: 1
          maxLength: 1000
    ResenaAnonimaRequest:
      type: object
      required:
        - autor_nombre
        - puntuacion
        - limpieza
        - servicio
        - calidad_precio
        - puntualidad
        - comentario
      properties:
        autor_nombre:
          type: string
          minLength: 1
          maxLength: 120
        puntuacion:
          type: integer
          minimum: 1
          maximum: 10
        limpieza:
          type: integer
          minimum: 1
          maximum: 10
        servicio:
          type: integer
          minimum: 1
          maximum: 10
        calidad_precio:
          type: integer
          minimum: 1
          maximum: 10
        puntualidad:
          type: integer
          minimum: 1
          maximum: 10
        comentario:
          type: string
          minLength: 1
          maxLength: 1000
    Resena:
      type: object
      required:
        - id
        - atr_id
        - autor_nombre
        - anonima
        - puntuacion
        - limpieza
        - servicio
        - calidad_precio
        - puntualidad
        - comentario
        - visible
        - creado_en
      properties:
        id:
          type: integer
          format: int64
        atr_id:
          type: integer
          format: int64
        autor_nombre:
          type: string
        anonima:
          type: boolean
        puntuacion:
          type: integer
          minimum: 1
          maximum: 10
        limpieza:
          type: integer
          minimum: 1
          maximum: 10
        servicio:
          type: integer
          minimum: 1
          maximum: 10
        calidad_precio:
          type: integer
          minimum: 1
          maximum: 10
        puntualidad:
          type: integer
          minimum: 1
          maximum: 10
        comentario:
          type: string
          minLength: 1
          maxLength: 1000
        visible:
          type: boolean
        creado_en:
          type: string
          format: date-time
    ResenaPublicada:
      type: object
      required:
        - atr_id
        - ren_id
        - promedio
        - limpieza
        - servicio
        - calidad_precio
        - puntualidad
        - numero_resenas
      properties:
        atr_id:
          type: integer
          format: int64
        ren_id:
          type: integer
          format: int64
        promedio:
          type: number
        limpieza:
          type: number
        servicio:
          type: number
        calidad_precio:
          type: number
        puntualidad:
          type: number
        numero_resenas:
          type: integer
    PaginationMetadata:
      type: object
      required:
        - total_results
        - page
        - limit
        - total_pages
      properties:
        total_results:
          type: integer
          example: 32
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_pages:
          type: integer
          example: 4
        next_cursor:
          type: string
          nullable: true
          example: eyJvZmZzZXQiOjEwfQ==
    NodeHealthResponse:
      type: object
      required:
        - status
        - node_id
        - node_code
        - version
        - database_connected
        - latency_ms
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
          example: UP
        node_id:
          type: string
          example: node-dilan-atracciones-01
        node_code:
          type: string
          example: DILAN_ATRACCIONES
        url_base:
          type: string
          example: 'https://descubreec.com/api/v1'
        version:
          type: string
          example: 2.0.0
        database_connected:
          type: boolean
          example: true
        latency_ms:
          type: integer
          description: Tiempo de respuesta del chequeo interno en milisegundos.
          example: 18
        memory_usage_mb:
          type: number
          example: 142.5
        uptime_seconds:
          type: integer
          example: 86400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI que identifica el tipo de error bajo estándar RFC 7807.
          example: 'https://booking.epn.edu.ec/errors/sin-cupos'
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Cupos Agotados para el Turno Horario
        status:
          type: integer
          description: Código de estado HTTP correspondiente.
          example: 409
        detail:
          type: string
          description: Explicación detallada de la ocurrencia del error.
          example: >-
            No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1,
            solicitados: 2.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v3/atracciones/reservas
        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: OUT_OF_STOCK
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: cid-8821a
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: customer.phone
              reason:
                type: string
                example: El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX).
  responses:
    ProblemDetails400:
      description: Datos inválidos (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autenticado (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: Se requiere el rol `ADMIN` (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: '`ATTRACTION_NOT_FOUND` o `REVIEW_NOT_FOUND` (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: '`REVIEW_ALREADY_EXISTS`: ya reseñó esta atracción (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servicio (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios
        (RDA2 Semana 11).  

        Se transmite en la cabecera `Authorization: Bearer <token>`.
