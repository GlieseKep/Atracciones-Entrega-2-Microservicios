          example: 9.8
        review_count:
          type: integer
          example: 1250
        badge_text:
          type: string
          example: Excepcional
        breakdown:
          $ref: '#/components/schemas/RatingsBreakdown'
    RatingsBreakdown:
      type: object
      description: Desglose analítico de opiniones por pilares de calidad.
      required:
        - limpieza
        - servicio
        - calidad_precio
        - puntualidad
      properties:
        limpieza:
          type: number
          description: Calificación de higiene y desinfección en unidades (1 a 10).
          example: 9.9
        servicio:
          type: number
          description: Calificación de la atención del guía y personal de apoyo (1 a 10).
          example: 9.8
        calidad_precio:
          type: number
          description: Relación entre lo pagado y la experiencia vivida (1 a 10).
          example: 9.6
        puntualidad:
          type: number
          description: Cumplimiento de los horarios programados del itinerario (1 a 10).
          example: 9.7
        cleanliness:
          type: number
          description: English alias for cleanliness rating score.
          example: 9.9
        service_score:
          type: number
          description: English alias for customer service rating score.
          example: 9.8
        value_for_money:
          type: number
          description: English alias for quality-to-price ratio score.
          example: 9.6
        punctuality:
          type: number
          description: English alias for itinerary punctuality score.
          example: 9.7
    ItineraryStop:
      type: object
      required:
        - stop_number
        - time
        - title
        - duration_minutes
      properties:
        stop_number:
          type: integer
          example: 1
        time:
          type: string
          description: Hora de inicio programada del hito o parada.
          example: '09:00 a.m.'
        title:
          type: string
          example: Punto de encuentro y salida en Boulevard Naciones Unidas
        description:
          type: string
          example: 'Recepción de pasajeros, verificación de vouchers QR y bienvenida por el guía.'
        duration_minutes:
          type: integer
          description: Duración estimada en minutos de la parada o actividad.
          example: 30
        location_name:
          type: string
          example: Parque La Carolina / Quinde Tour Center
        numero_parada:
          type: integer
          description: Alias canónico en español para orden secuencial de la parada.
          example: 1
        hora:
          type: string
          description: Alias canónico en español para hora programada.
          example: '09:00 a.m.'
        titulo:
          type: string
          description: Alias canónico en español para título de la parada.
          example: Punto de encuentro y salida en Boulevard Naciones Unidas
        descripcion:
          type: string
          description: Alias canónico en español para descripción de actividades en la parada.
          example: 'Recepción de pasajeros, verificación de vouchers QR y bienvenida por el guía.'
        duracion_minutos:
          type: integer
          description: Alias canónico en español para duración estimada en minutos.
          example: 30
        nombre_ubicacion:
          type: string
          description: Alias canónico en español para referencia del lugar.
          example: Parque La Carolina / Quinde Tour Center
    MeetingPointGeo:
      type: object
      required:
        - address
        - city
        - latitude
        - longitude
      properties:
        address:
          type: string
          example: 'Boulevard Naciones Unidas y Av. de los Shyris, frente al Banco del Pichincha'
        city:
          type: string
          example: Quito
        latitude:
          type: number
          example: -0.178652
        longitude:
          type: number
          example: -78.48312
        arrival_instructions:
          type: string
          example: Presentarse con 15 minutos de anticipación junto al totem informativo rojo de Descubre EC.
        google_maps_url:
          type: string
          example: 'https://maps.google.com/?q=-0.178652,-78.483120'
        direccion:
          type: string
          description: Alias canónico en español para dirección física.
          example: 'Boulevard Naciones Unidas y Av. de los Shyris, frente al Banco del Pichincha'
        ciudad:
          type: string
          description: Alias canónico en español para ciudad.
          example: Quito
        latitud:
          type: number
          description: Alias canónico en español para coordenada GPS de latitud.
          example: -0.178652
        longitud:
          type: number
          description: Alias canónico en español para coordenada GPS de longitud.
          example: -78.48312
        instrucciones_llegada:
          type: string
          description: Alias canónico en español para pautas de encuentro.
          example: Presentarse con 15 minutos de anticipación junto al totem informativo rojo de Descubre EC.
    AccessibilityAttributes:
      type: object
      properties:
        wheelchair_accessible:
          type: boolean
          description: Apto para personas en silla de ruedas en bus y paradas.
          example: true
        stroller_accessible:
          type: boolean
          description: Apto para carriolas de bebés.
          example: true
        service_animals_allowed:
          type: boolean
          description: Admisión de perros guía y animales de asistencia según normativa.
          example: true
        accesible_silla_ruedas:
          type: boolean
          description: Alias canónico en español para accesibilidad en silla de ruedas.
          example: true
        accesible_carriola:
          type: boolean
          description: Alias canónico en español para aptitud de carriolas infantiles.
          example: true
        admite_animales_asistencia:
          type: boolean
          description: Alias canónico en español para ingreso de animales de servicio.
          example: true
    CancellationPolicy:
      type: object
      required:
        - free_cancellation
        - deadline_hours
      properties:
        free_cancellation:
          type: boolean
          example: true
        deadline_hours:
          type: integer
          description: Horas mínimas previas al inicio para cancelar sin penalidad.
          example: 24
        description:
          type: string
          example: Cancela gratis hasta 24 horas antes de la actividad y recibe el 100% de reembolso.
        cancelacion_gratuita:
          type: boolean
          description: Alias canónico en español para cancelación gratuita sin recargo.
          example: true
        horas_limite:
          type: integer
          description: Alias canónico en español para plazo de horas previas de antelación.
          example: 24
        descripcion:
          type: string
          description: Alias canónico en español para descripción de la política.
          example: Cancela gratis hasta 24 horas antes de la actividad y recibe el 100% de reembolso.
    ProveedorInfo:
      type: object
      properties:
        id:
          type: string
          example: proveedor-atracciones-dilan
        nombre_comercial:
          type: string
          example: Descubre EC Tours & Experiences
        ruc:
          type: string
          example: '1792348123001'
        telefono_emergencia:
          type: string
          example: '+593991234567'
        email_soporte:
          type: string
          example: soporte@descubreec.com
    NodeHealthResponse:
      type: object
      required:
        - status
        - node_id
        - node_code
        - version
        - database_connected
        - latency_ms
        - timestamp
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
          example: UP
        node_id:
          type: string
          example: node-dilan-atracciones-01
        node_code:
          type: string
          example: DILAN_ATRACCIONES
        url_base:
          type: string
          example: 'https://descubreec.com/api/v1'
        version:
          type: string
          example: 2.0.0
        database_connected:
          type: boolean
          example: true
        latency_ms:
          type: integer
          description: Tiempo de respuesta del chequeo interno en milisegundos.
          example: 18
        memory_usage_mb:
          type: number
          example: 142.5
        uptime_seconds:
          type: integer
          example: 86400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
    LogisticaReserva:
      type: object
      required:
        - atraccion_id
        - nombre
        - punto_encuentro
        - free_cancellation
        - deadline_hours
      properties:
        atraccion_id:
          type: string
        nombre:
          type: string
        punto_encuentro:
          type: string
        free_cancellation:
          type: boolean
        deadline_hours:
          type: integer
        guia:
          type: object
          required:
            - gui_id
            - nombre
          properties:
            gui_id:
              type: integer
              format: int64
            nombre:
              type: string
          nullable: true
    Guia:
      type: object
      required:
        - codigo
        - nombre
        - credencial_mintur
        - operador
        - activo
      properties:
        codigo:
          type: string
          example: GUIA-CARLOS-01
        nombre:
          type: string
        credencial_mintur:
          type: string
        operador:
          type: string
        usu_id:
          type: integer
          format: int64
          nullable: true
        activo:
          type: boolean
    GuiaRequest:
      type: object
      required:
        - codigo
        - nombre
        - credencial_mintur
        - operador
      properties:
        codigo:
          type: string
          maxLength: 30
        nombre:
          type: string
          maxLength: 150
        credencial_mintur:
          type: string
          maxLength: 30
        operador:
          type: string
        usu_id:
          type: integer
          format: int64
          nullable: true
    GuiaUpdateRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 150
        credencial_mintur:
          type: string
          maxLength: 30
        usu_id:
          type: integer
          format: int64
          nullable: true
        activo:
          type: boolean
    Operador:
      allOf:
        - $ref: '#/components/schemas/ProveedorInfo'
        - type: object
          required:
            - prov_id
            - activo
          properties:
            direccion:
              type: string
              nullable: true
            prov_id:
              type: integer
            activo:
              type: boolean
    OperadorRequest:
      type: object
      required:
        - id
        - nombre_comercial
        - prov_id
      properties:
        id:
          type: string
          maxLength: 60
        nombre_comercial:
          type: string
          maxLength: 150
        ruc:
          type: string
          pattern: '^[0-9]{13}$'
        email_soporte:
          type: string
          format: email
        telefono_emergencia:
          type: string
        direccion:
          type: string
          maxLength: 255
        prov_id:
          type: integer
    OperadorUpdateRequest:
      type: object
      properties:
        nombre_comercial:
          type: string
          maxLength: 150
        ruc:
          type: string
          pattern: '^[0-9]{13}$'
        email_soporte:
          type: string
          format: email
        telefono_emergencia:
          type: string
        direccion:
          type: string
          maxLength: 255
        prov_id:
          type: integer
        activo:
          type: boolean
    CategoriaRequest:
      type: object
      required:
        - id
        - nombre
        - slug
      properties:
        id:
          type: string
          maxLength: 40
        padre_id:
          type: string
          nullable: true
        nombre:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
        descripcion:
          type: string
          maxLength: 255
        icono:
          type: string
          maxLength: 40
        orden:
          type: integer
        incluye_comida:
          type: boolean
        incluye_transporte:
          type: boolean
        incluye_guia:
          type: boolean
    CategoriaUpdateRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 80
        descripcion:
          type: string
          maxLength: 255
        icono:
          type: string
          maxLength: 40
        orden:
          type: integer
        incluye_comida:
          type: boolean
        incluye_transporte:
          type: boolean
        incluye_guia:
          type: boolean
        activa:
          type: boolean
    Inclusion:
      type: object
      required:
        - id
        - tipo
        - nombre
      properties:
        id:
          type: integer
        tipo:
          type: string
        nombre:
          type: string
        orden:
          type: integer
    AtraccionRequest:
      type: object
      required:
        - name
        - description
        - tipo
        - latitude
        - longitude
        - duration_hours
        - ciu_id
        - operador
        - categorias
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
        description:
          type: string
        short_description:
          type: string
          maxLength: 280
        tipo:
          type: string
          enum:
            - GUIDED_TOUR
            - ADMISSION
            - DAY_TRIP
            - TRANSPORT
            - PACKAGE
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
          maxLength: 255
        meeting_point:
          type: string
          maxLength: 255
        arrival_instructions:
          type: string
          maxLength: 500
        duration_hours:
          type: number
        ciu_id:
          type: integer
        operador:
          type: string
        categorias:
          type: array
          items:
            type: string
        idiomas:
          type: array
          items:
            type: string
        inclusiones:
          type: array
          items:
            type: integer
        fotos:
          type: array
          items:
            type: object
            required:
              - url
              - alt
            properties:
              url:
                type: string
                maxLength: 500
              alt:
                type: string
                maxLength: 200
              orden:
                type: integer
        itinerario:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryStop'
        inclusions:
          $ref: '#/components/schemas/InclusionesFlags'
        accessibility:
          $ref: '#/components/schemas/AccessibilityAttributes'
        cancellation_policy:
          $ref: '#/components/schemas/CancellationPolicy'
        permite_paquete:
          type: boolean
        porcentaje_descuento_paquete:
          type: number
          minimum: 0
          maximum: 100
        destacada:
          type: boolean
    AtraccionAdmin:
      allOf:
        - $ref: '#/components/schemas/AtraccionDetailResponseV2'
        - type: object
          required:
            - estado
            - tipo
            - ciu_id
            - categorias
            - idiomas
            - inclusiones
            - fotos
          properties:
            estado:
              type: string
              enum:
                - BORRADOR
                - PUBLICADA
                - INACTIVA
            tipo:
              type: string
            ciu_id:
              type: integer
            destacada:
              type: boolean
            categorias:
              type: array
              items:
                type: string
            idiomas:
              type: array
              items:
                type: string
            inclusiones:
              type: array
              items:
                type: integer
            fotos:
              type: array
              items:
                type: object
                required:
                  - url
                  - alt
                  - orden
                properties:
                  url:
                    type: string
                  alt:
                    type: string
                  orden:
                    type: integer
    AtraccionAdminPage:
      type: object
      required:
        - metadata
        - data
      properties:
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtraccionAdmin'
    ReferenciaAtraccion:
      type: object
      required:
        - atr_id
        - id
        - slug
        - nombre
      properties:
        atr_id:
          type: integer
          format: int64
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
  responses:
    ProblemDetails500:
      description: Error interno del servidor en la tienda socia (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails400:
      description: Parámetros inválidos o sintaxis de solicitud incorrecta (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: Recurso no encontrado en el sistema de atracciones (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autenticado. Cabecera Authorization con token JWT o X-API-Key ausente o inválida (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'https://descubreec.com/errors/unauthorized'
            title: No Autorizado
            status: 401
            detail: 'El token JWT no fue provisto, ha expirado o la firma criptográfica es inválida.'
            instance: /api/v3/atracciones/reservas
            code: UNAUTHORIZED
            correlation_id: cid-auth-01
            timestamp: '2026-10-24T15:00:00Z'
    ProblemDetails403:
      description: Acceso denegado. El usuario no posee los permisos o roles requeridos (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'https://descubreec.com/errors/forbidden'
            title: Acceso Prohibido
            status: 403
            detail: No cuenta con el rol de administración o credenciales de socio requeridas para esta acción.
            instance: /api/v3/atracciones/promociones/contrato
            code: FORBIDDEN
            correlation_id: cid-auth-02
            timestamp: '2026-10-24T15:00:00Z'
    ProblemDetails409:
      description: 'Conflicto de estado, colisión de Idempotencia o Cupos Agotados (RFC 7807).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails422:
      description: Entidad no procesable (ej. fallo algorítmico en la cédula ecuatoriana).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios
        (RDA2 Semana 11).  

        Se transmite en la cabecera `Authorization: Bearer <token>`.
    ServiceTokenAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Secreto compartido por los componentes internos.
