            Disfruta de la mejor experiencia turística de la capital ecuatoriana en bus de dos pisos con guía bilingüe
            certificado.
        ciudad:
          type: string
          description: Alias canónico en español para ciudad.
          example: Quito
        duracion:
          type: string
          description: Alias canónico en español para duración estimada.
          example: 7 horas
        precio:
          $ref: '#/components/schemas/TarifaBaseDesglosada'
          description: Alias canónico en español para tarifa base desglosada.
        calificacion:
          $ref: '#/components/schemas/RatingCompletoDesglosado'
          description: Alias canónico en español para calificación desglosada.
        inclusiones:
          $ref: '#/components/schemas/InclusionesFlags'
          description: Alias canónico en español para banderas de inclusión obligatorias.
        punto_encuentro_geo:
          $ref: '#/components/schemas/MeetingPointGeo'
