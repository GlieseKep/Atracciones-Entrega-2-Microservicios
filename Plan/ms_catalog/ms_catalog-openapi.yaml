          example: 15
        photos:
          type: array
          items:
            type: string
        proveedor:
          $ref: '#/components/schemas/ProveedorInfo'
        nombre:
          type: string
          description: Alias canónico en español para nombre de la atracción.
          example: Quito City Bus Tour & Mitad del Mundo Oficial
        descripcion:
          type: string
