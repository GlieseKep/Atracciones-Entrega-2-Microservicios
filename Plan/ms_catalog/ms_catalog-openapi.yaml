              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
components:
  parameters:
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  

        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams
        de Apache Kafka.
      schema:
        type: string
      example: cid-8821a-9923
  schemas:
    CategoryTreeNode:
      type: object
      required:
        - id
        - nombre
        - slug
        - incluye_comida
        - incluye_transporte
        - incluye_guia
      properties:
        id:
          type: string
          description: Identificador único de la categoría.
          example: cat-tours-100
        nombre:
          type: string
          description: Nombre legible de la categoría.
          example: Tours y Experiencias Guiadas
        slug:
          type: string
          description: Identificador web URL-friendly.
          example: tours-experiencias
        descripcion:
          type: string
          description: Resumen descriptivo de las actividades de este grupo.
          example: Recorridos por la ciudad y la naturaleza con guías titulados.
        icono:
          type: string
          description: Nombre del icono para la interfaz gráfica (FontAwesome o Lucide).
          example: compass
        incluye_comida:
          type: boolean
          description: Bandera booleana obligatoria. Indica si las actividades de esta categoría incluyen alimentación.
          example: false
        incluye_transporte:
          type: boolean
          description: Bandera booleana obligatoria. Indica si incluye traslado vehicular.
          example: true
        incluye_guia:
          type: boolean
          description: Bandera booleana obligatoria. Indica si incluye acompañamiento de guía profesional.
          example: true
        orden:
          type: integer
          description: Posición ordinal de renderizado en el menú.
          example: 1
        subcategorias:
          type: array
          description: Lista anidada recursiva de subcategorías hijas.
          items:
            $ref: '#/components/schemas/CategoryTreeNode'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI que identifica el tipo de error bajo estándar RFC 7807.
          example: 'https://booking.epn.edu.ec/errors/sin-cupos'
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Cupos Agotados para el Turno Horario
        status:
          type: integer
          description: Código de estado HTTP correspondiente.
          example: 409
        detail:
          type: string
          description: Explicación detallada de la ocurrencia del error.
          example: >-
            No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1,
            solicitados: 2.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v3/atracciones/reservas
        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: OUT_OF_STOCK
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: cid-8821a
        timestamp:
          type: string
          format: date-time
          example: '2026-10-21T16:44:01Z'
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: customer.phone
              reason:
                type: string
                example: El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX).
    CategoryFlat:
      type: object
      required:
        - id
        - nombre
        - slug
      properties:
        id:
          type: string
          example: cat-tours-201
        padre_id:
          type: string
          nullable: true
          description: Identificador de la categoría padre (null si es categoría raíz).
          example: cat-tours-100
        nombre:
          type: string
          example: Tours Gastronómicos
        slug:
          type: string
          example: tours-gastronomicos
        incluye_comida:
          type: boolean
          example: true
        incluye_transporte:
          type: boolean
          example: false
        incluye_guia:
          type: boolean
          example: true
    SearchAtraccionesRequestV2:
      type: object
      properties:
        query:
          type: string
          description: 'Término de búsqueda libre o nombre de destino (ej. "Quito", "Mitad del Mundo").'
          example: Quito
        ciudad:
          type: string
          description: Ciudad geográfica de destino.
          example: Quito
        fecha_inicio:
          type: string
          format: date
          description: Fecha de inicio de la experiencia turística (`YYYY-MM-DD`).
          example: '2026-10-25'
        fecha_fin:
          type: string
          format: date
          description: Fecha final para rangos de búsqueda flexible (`YYYY-MM-DD`).
          example: '2026-10-28'
        categoria_id:
          type: string
          description: Filtrar por identificador de categoría o subcategoría.
          example: cat-tours-201
        incluye_comida:
          type: boolean
          description: Filtrar únicamente experiencias que incluyan alimentación.
        incluye_transporte:
          type: boolean
          description: Filtrar únicamente experiencias que incluyan transporte.
        incluye_guia:
          type: boolean
          description: Filtrar únicamente experiencias que cuenten con guía certificado.
        precio_min:
          type: number
          minimum: 0
          description: Precio mínimo en USD por adulto.
          example: 15
        precio_max:
          type: number
          description: Precio máximo en USD por adulto.
          example: 150
        duracion_max_horas:
          type: integer
          description: Límite de duración en horas (ej. 4 para tours de medio día).
          example: 8
        idioma_guia:
          type: string
          description: 'Idioma requerido del guía (ej. "Español", "Inglés", "Francés").'
          example: Español
        accesible_silla_ruedas:
          type: boolean
          description: Filtro de accesibilidad universal para personas en silla de ruedas.
        animales_asistencia:
          type: boolean
          description: Filtro de admisión obligatoria de animales de asistencia o lazarillos.
        cancelacion_gratuita:
          type: boolean
          description: Filtro de tours con cancelación sin costo hasta 24 horas antes.
        adult_count:
          type: integer
          default: 1
          minimum: 1
          description: Cantidad de personas adultas para cotizar disponibilidad.
        cantidad_adultos:
          type: integer
          default: 1
          minimum: 1
          description: Alias canónico en español para cantidad de adultos solicitados.
        page:
          type: integer
          default: 1
          minimum: 1
        limit:
          type: integer
          default: 10
          maximum: 50
    SearchAtraccionesResponseV2:
      type: object
      required:
        - metadata
        - data
      properties:
        request_id:
          type: string
          example: req-atr-8812
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtraccionCardResponseV2'
    PaginationMetadata:
      type: object
      required:
        - total_results
        - page
        - limit
        - total_pages
      properties:
        total_results:
          type: integer
          example: 32
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_pages:
          type: integer
          example: 4
        next_cursor:
          type: string
          nullable: true
          example: eyJvZmZzZXQiOjEwfQ==
    AtraccionCardResponseV2:
      type: object
      required:
        - id
        - name
        - city
        - price
        - rating
        - duration
        - inclusions
      properties:
        id:
          type: string
          description: Identificador único público (ej. ID alfanumérico de Dilan o UUID).
          example: PRhu4UBTWPBC
        slug:
          type: string
          example: quito-city-bus-tour-mitad-del-mundo
        name:
          type: string
          example: Quito City Bus Tour & Mitad del Mundo Oficial
        short_description:
          type: string
          example: Recorrido panorámico de dos pisos por el Centro Histórico y la Ciudad Mitad del Mundo.
        city:
          type: string
          example: Quito
        duration:
          type: string
          example: 7 horas
        duration_hours:
          type: number
          example: 7
        price:
          $ref: '#/components/schemas/TarifaBaseDesglosada'
        rating:
          $ref: '#/components/schemas/RatingResumen'
        free_cancellation:
          type: boolean
          description: Indica si el tour admite cancelación gratuita sin penalidad.
          example: true
        free_cancellation_hours:
          type: integer
          description: Plazo de horas de antelación para cancelar gratis.
          example: 24
        inclusions:
          $ref: '#/components/schemas/InclusionesFlags'
        meeting_point:
          type: string
          example: Boulevard Naciones Unidas y Av. Shyris (Parada Quinde)
        photos:
          type: array
          items:
            type: string
          example:
            - 'https://images.unsplash.com/photo-1589394815804-964ed0be2eb5?w=600'
            - 'https://images.unsplash.com/photo-1596436889106-be35e843f974?w=600'
        permite_paquete:
          type: boolean
          description: Bandera que habilita el armado de paquetes y combos turísticos con descuento en Booking.
          example: true
        nombre:
          type: string
          description: Alias canónico en español para nombre de la atracción.
          example: Quito City Bus Tour & Mitad del Mundo Oficial
        descripcion_corta:
          type: string
          description: Alias canónico en español para descripción corta.
          example: Recorrido panorámico de dos pisos por el Centro Histórico y la Ciudad Mitad del Mundo.
        ciudad:
          type: string
          description: Alias canónico en español para ciudad.
          example: Quito
        duracion:
          type: string
          description: Alias canónico en español para duración estimada.
          example: 7 horas
        precio:
          $ref: '#/components/schemas/TarifaBaseDesglosada'
          description: Alias canónico en español para tarifa base desglosada.
        calificacion:
          $ref: '#/components/schemas/RatingResumen'
          description: Alias canónico en español para calificación resumida.
        cancelacion_gratuita:
          type: boolean
          description: Alias canónico en español para bandera de cancelación gratuita.
          example: true
        inclusiones:
          $ref: '#/components/schemas/InclusionesFlags'
          description: Alias canónico en español para banderas de inclusión obligatorias.
        punto_encuentro:
          type: string
          description: Alias canónico en español para punto de encuentro.
          example: Boulevard Naciones Unidas y Av. Shyris (Parada Quinde)
    TarifaBaseDesglosada:
      type: object
      required:
        - currency
        - adult
        - child
        - senior
        - infant
      properties:
        currency:
          type: string
          example: USD
        adult:
          type: number
          description: Tarifa completa de adulto (13 a 64 años).
          example: 30
        child:
          type: number
          description: 'Tarifa para niños (5 a 12 años, típicamente con 50% descuento).'
          example: 15
        senior:
          type: number
          description: Tarifa preferencial para adultos mayores (65+ años).
          example: 18
        infant:
          type: number
          description: 'Tarifa de infantes/bebés (0 a 4 años, tarifa $0.00 pero ocupa cupo de aforo).'
          example: 0
        student:
          type: number
          description: Tarifa preferencial para estudiantes acreditados con carnet (descuento típico 25%).
          example: 22.5
        adulto:
          type: number
          description: Alias canónico en español para tarifa de adulto.
          example: 30
        nino:
          type: number
          description: Alias canónico en español para tarifa de niño.
          example: 15
        tercera_edad:
          type: number
          description: Alias canónico en español para tarifa de adulto mayor.
          example: 18
        infante:
          type: number
          description: Alias canónico en español para tarifa de infante/bebé ($0.00).
          example: 0
        estudiante:
          type: number
          description: Alias canónico en español para tarifa de estudiante.
          example: 22.5
        moneda:
          type: string
          description: Alias canónico en español para código de divisa (USD).
          example: USD
    RatingResumen:
      type: object
      required:
        - score
        - review_count
      properties:
        score:
          type: number
          example: 9.8
        review_count:
          type: integer
          example: 1250
        badge_text:
          type: string
          example: Excepcional
    InclusionesFlags:
      type: object
      required:
        - includes_food
        - includes_transport
        - includes_guide
      properties:
        includes_food:
          type: boolean
          description: Whether food/snacks/tastings are included.
          example: true
        includes_transport:
          type: boolean
          description: Whether ground/panoramic transport is included.
          example: true
        includes_guide:
          type: boolean
          description: Whether certified official guide service is included.
          example: true
        incluye_comida:
          type: boolean
          description: Alias en español para retrocompatibilidad.
          example: true
        incluye_transporte:
          type: boolean
          description: Alias en español para retrocompatibilidad.
          example: true
        incluye_guia:
          type: boolean
          description: Alias en español para retrocompatibilidad.
          example: true
    AtraccionDetailResponseV2:
      type: object
      required:
        - id
        - name
        - description
        - city
        - price
        - rating
        - inclusions
        - itinerary
        - meeting_point_geo
