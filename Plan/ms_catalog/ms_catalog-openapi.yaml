openapi: 3.0.3
info:
  title: ms_catalog · Catalog & Attractions Service (Descubre EC)
  version: 1.0.0
  description: >-
    Contrato propio del microservicio **4 · Catalog & Attractions Service** (REST), derivado de la base `ms_catalog`

    (`Plan/02_microservicios_v2_bases_de_datos.sql`), de `Plan/arquitectura_esb_v3.html` y del contrato

    `Plan/PlanBooking/atracciones-openapi-v3(1).yaml`.


    ## Alcance

    Operadores, guías, categorías, idiomas, inclusiones y atracciones.


    ## Rutas públicas

    Las cinco rutas de la etiqueta *Catálogo (contrato v3)* y sus esquemas están **copiados sin cambios** del contrato
    v3.


    ## Eventos

    Consume `RESENA_PUBLICADA` (Review) y `TARIFA_ACTUALIZADA` (Pricing).


    ## Errores

    RFC 7807 (`application/problem+json`), con el esquema `ProblemDetails` del contrato v3.
servers:
  - url: /api/v3
    description: Ruta canónica v3 detrás del API Gateway y el ESB
  - url: 'http://localhost:4019/api/v3'
    description: Desarrollo local
security:
  - BearerAuth: []
tags:
  - name: Catálogo (contrato v3)
    description: 'Consulta pública, idéntica al contrato v3.'
  - name: Guías
    description: Guías de los operadores.
  - name: Administración
    description: 'Rol ADMIN, u OPERADOR sobre su propio operador.'
  - name: Interno
    description: Rutas para Booking y otros servicios.
  - name: Salud
    description: Telemetría del nodo.
paths:
  /atracciones/categorias/arbol:
    get:
      tags:
        - Catálogo (contrato v3)
      summary: Consultar árbol jerárquico recursivo de categorías (Taxonomía padre-hija)
      security: []
      description: >
        Retorna la estructura en árbol de las categorías turísticas con soporte multinivel (implementado mediante
        `@Tree('closure-table')` o autorreferencia `cat_padre_id`).

        Cada nodo incluye de forma obligatoria los atributos de inclusión exigidos por la cátedra:

        * `incluye_comida`: Almuerzos, cenas, degustaciones de chocolate o catas de café.

        * `incluye_transporte`: Recogida en hotel, transporte turístico privado o bus panorámico.

        * `incluye_guia`: Acompañamiento de guía turístico oficial certificado.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Árbol recursivo de categorías recuperado exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTreeNode'
              example:
                - id: cat-tours-100
                  nombre: Tours y Experiencias Guiadas
                  slug: tours-experiencias
                  descripcion: Actividades de inmersión cultural y natural con guías expertos.
                  icono: compass
                  incluye_comida: false
                  incluye_transporte: true
                  incluye_guia: true
                  orden: 1
                  subcategorias:
                    - id: cat-tours-201
                      nombre: Tours Gastronómicos y Catas
                      slug: tours-gastronomicos
                      descripcion: Degustaciones de comida típica ecuatoriana y chocolate fino de aroma.
                      icono: utensils
                      incluye_comida: true
                      incluye_transporte: false
                      incluye_guia: true
                      orden: 1
                      subcategorias: []
                    - id: cat-tours-202
                      nombre: Excursiones a Volcanes y Aventura
                      slug: volcanes-aventura
                      descripcion: 'Senderismo y expediciones al Cotopaxi, Chimborazo y Quilotoa.'
                      icono: mountain
                      incluye_comida: true
                      incluye_transporte: true
                      incluye_guia: true
                      orden: 2
                      subcategorias: []
                - id: cat-cultura-200
                  nombre: Museos y Sitios Arqueológicos
                  slug: museos-cultura
                  descripcion: Entradas directas a patrimonios y centros históricos.
                  icono: landmark
                  incluye_comida: false
                  incluye_transporte: false
                  incluye_guia: false
                  orden: 2
                  subcategorias: []
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /atracciones/categorias:
    get:
      tags:
        - Catálogo (contrato v3)
      summary: Consultar catálogo plano de categorías con filtro por padre
      description: >
        Retorna la lista plana de categorías. Permite filtrar por `padre_id` para construir componentes visuales tipo
        tabs o menús desplegables sin procesar recursión en cliente.
      security: []
      parameters:
        - name: padre_id
          in: query
          required: false
          description: >-
            ID de la categoría padre para listar únicamente sus hijas directas. Si se omite, retorna todas las
            categorías raíz.
          schema:
            type: string
          example: cat-tours-100
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Listado plano de categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryFlat'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /atracciones/search:
    post:
      tags:
        - Catálogo (contrato v3)
      summary: Búsqueda avanzada y filtrado de experiencias turísticas
      description: >
        Permite a los usuarios buscar y filtrar atracciones por destino geográfico, fechas de viaje, franja
        presupuestaria, árbol de categorías y atributos específicos de confort (comida, transporte, accesibilidad).

        Si no se especifica una fecha puntual, el endpoint retorna las atracciones activas indicando el precio base
        referencial (*"Desde US$ XX por adulto"*).
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAtraccionesRequestV2'
      responses:
        '200':
          description: Resultados de búsqueda obtenidos con paginación y metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAtraccionesResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /atracciones:
    get:
      tags:
        - Catálogo (contrato v3)
      summary: Listado paginado de atracciones turísticas
      description: Consulta el catálogo general de atracciones turísticas mediante parámetros en la URL.
      security: []
      parameters:
        - name: city
          in: query
          required: false
          description: 'Nombre de la ciudad turística (ej. Quito, Baños, Cuenca, Galápagos).'
          schema:
            type: string
          example: Quito
        - name: categoria_id
          in: query
          required: false
          description: Identificador de la categoría deseada.
          schema:
            type: string
        - name: incluye_comida
          in: query
          required: false
          description: Filtrar solo atracciones que incluyan alimentación.
          schema:
            type: boolean
        - name: incluye_transporte
          in: query
          required: false
          description: Filtrar solo atracciones que incluyan traslado.
          schema:
            type: boolean
        - name: incluye_guia
          in: query
          required: false
          description: Filtrar solo experiencias con guía acreditado.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Número de página (1-indexed).
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de resultados por página.
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: sort
          in: query
          required: false
          description: Criterio de ordenamiento.
          schema:
            type: string
            enum:
              - PRICE_ASC
              - PRICE_DESC
              - RATING_DESC
              - POPULARITY
            default: POPULARITY
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Listado de experiencias turísticas recuperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAtraccionesResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/atracciones/{id}':
    get:
      tags:
        - Catálogo (contrato v3)
      summary: Consultar detalle técnico completo de una atracción por ID o Slug
      description: |
        Retorna la ficha enriquecida de la experiencia turística con:
        * Desglose analítico de puntuaciones (*ratings breakdown* en Limpieza, Servicio y Calidad-Precio).
        * Itinerario cronológico secuencial de hitos con tiempos de permanencia.
        * Punto de encuentro geoespacial con coordenadas GPS y dirección física.
        * Atributos de accesibilidad física y admisión de animales de servicio.
        * Políticas de cancelación gratuita y plazo límite antes de la actividad.
        * Parámetros para la integración en paquetes turísticos y combos dinámicos (`permite_paquete`).
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador alfanumérico único (UUID o Slug de la atracción).
          schema:
            type: string
          example: PRhu4UBTWPBC
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Ficha completa de la atracción recuperada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtraccionDetailResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /guias:
    get:
      tags:
        - Guías
      summary: Listar guías
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: operador
          in: query
          required: false
          schema:
            type: string
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Guías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guia'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    post:
      tags:
        - Guías
      summary: Crear un guía
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaRequest'
      responses:
        '201':
          description: Guía creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guia'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/guias/{codigo}':
    get:
      tags:
        - Guías
      summary: Obtener un guía
      description: Lo usa Booking para `guia_asignado` y para validar `guia_codigo` en el check-in.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Guía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guia'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      security:
        - BearerAuth: []
        - ServiceTokenAuth: []
    patch:
      tags:
        - Guías
      summary: Editar o desactivar un guía
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaUpdateRequest'
      responses:
        '200':
          description: Guía actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guia'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/internal/atracciones/{id}/logistica':
    get:
      tags:
        - Interno
      summary: Datos de una atracción para una reserva
      description: 'Lo usa Booking. Sin `gui_id`, asigna el primer guía activo del operador. Con `gui_id`, devuelve ese guía.'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: gui_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Datos de la reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogisticaReserva'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      security:
        - ServiceTokenAuth: []
  '/internal/atracciones/{id}/referencia':
    get:
      tags:
        - Interno
      summary: Convertir el ID público o slug en atr_id
      description: Lo usan los servicios que guardan `atr_id` como ID lógico. `404` si no existe o no está publicada.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Atracción.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenciaAtraccion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      security:
        - ServiceTokenAuth: []
  /operadores:
    get:
      tags:
        - Administración
      summary: Listar operadores
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Operadores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operador'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    post:
      tags:
        - Administración
      summary: Crear un operador
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorRequest'
      responses:
        '201':
          description: Operador creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operador'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/operadores/{codigo}':
    patch:
      tags:
        - Administración
      summary: Editar o desactivar un operador
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorUpdateRequest'
      responses:
        '200':
          description: Operador actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operador'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/operadores/{codigo}/usuarios':
    post:
      tags:
        - Administración
      summary: Vincular un usuario a un operador
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usu_id
                - cargo
              properties:
                usu_id:
                  type: integer
                  format: int64
                cargo:
                  type: string
                  enum:
                    - ADMIN
                    - VENDEDOR
                    - GUIA
      responses:
        '204':
          description: Vinculado.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/operadores/{codigo}/usuarios/{usu_id}':
    delete:
      tags:
        - Administración
      summary: Desvincular un usuario
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: codigo
          in: path
          required: true
          schema:
            type: string
        - name: usu_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Desvinculado.
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /categorias:
    post:
      tags:
        - Administración
      summary: Crear una categoría
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
      responses:
        '201':
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryFlat'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  '/categorias/{codigo}':
    patch:
      tags:
        - Administración
      summary: Editar o desactivar una categoría
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaUpdateRequest'
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryFlat'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /idiomas:
    get:
      tags:
        - Administración
      summary: Listar idiomas
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Idiomas.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - codigo
                    - nombre
                  properties:
                    codigo:
                      type: string
                    nombre:
                      type: string
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      security: []
  /inclusiones:
    get:
      tags:
        - Administración
      summary: Listar inclusiones
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum:
              - INCLUYE
              - NO_INCLUYE
              - RECOMENDACION
      responses:
        '200':
          description: Inclusiones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inclusion'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    post:
      tags:
        - Administración
      summary: Crear una inclusión
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tipo
                - nombre
              properties:
                tipo:
                  type: string
                  enum:
                    - INCLUYE
                    - NO_INCLUYE
                    - RECOMENDACION
                nombre:
                  type: string
                  maxLength: 150
                orden:
                  type: integer
      responses:
        '201':
          description: Inclusión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inclusion'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /admin/atracciones:
    get:
      tags:
        - Administración
      summary: Listar atracciones de cualquier estado
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - BORRADOR
              - PUBLICADA
              - INACTIVA
        - name: operador
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
