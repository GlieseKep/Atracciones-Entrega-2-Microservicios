# Compila, empaqueta (tools/package-microservices.mjs) y publica el mismo paquete en las 20 apps de App Service.
# Cada app arranca su propio main.js con el comando de inicio que se configuró en Azure.
#
# Configuración del repositorio (Settings → Secrets and variables → Actions):
#   Variables: AZURE_APP_PREFIX (p. ej. tourgirls) y AZURE_APP_SUFFIX (p. ej. mm): la app es <prefijo>-<app>-<sufijo>.
#   Secretos:  AZURE_PUBLISH_<APP> con el perfil de publicación de cada app (AZURE_PUBLISH_MS_IDENTITY, AZURE_PUBLISH_ESB…).
name: Desplegar microservicios en Azure

on:
  push:
    branches: [main]
    paths:
      - 'apps/esb/**'
      - 'apps/gateway/**'
      - 'apps/graphql/**'
      - 'apps/partner-api/**'
      - 'apps/services/ms-*/**'
      - 'packages/platform/**'
      - 'packages/contracts/**'
      - 'tools/package-microservices.mjs'
      - 'package-lock.json'
      - '.github/workflows/deploy-microservices.yml'
  workflow_dispatch:

concurrency:
  group: deploy-microservices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b packages/platform apps/services apps/esb apps/gateway apps/graphql apps/partner-api
      - run: node tools/package-microservices.mjs
      # zip en Linux: rutas con '/', que App Service entiende.
      - run: cd out/microservices && zip -qr ../microservices.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: microservices
          path: out/microservices.zip
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Si Kudu se cuelga (plan sin memoria), la acción espera sin límite: mejor fallar y reintentar esa app.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { app: gateway, secret: GATEWAY }
          - { app: graphql, secret: GRAPHQL }
          - { app: partner-api, secret: PARTNER_API }
          - { app: esb, secret: ESB }
          - { app: ms-identity, secret: MS_IDENTITY }
          - { app: ms-location, secret: MS_LOCATION }
          - { app: ms-catalog, secret: MS_CATALOG }
          - { app: ms-billing-profile, secret: MS_BILLING_PROFILE }
          - { app: ms-pricing, secret: MS_PRICING }
          - { app: ms-inventory, secret: MS_INVENTORY }
          - { app: ms-review, secret: MS_REVIEW }
          - { app: ms-coupon, secret: MS_COUPON }
          - { app: ms-cart, secret: MS_CART }
          - { app: ms-payment, secret: MS_PAYMENT }
          - { app: ms-order, secret: MS_ORDER }
          - { app: ms-booking, secret: MS_BOOKING }
          - { app: ms-refund, secret: MS_REFUND }
          - { app: ms-invoicing, secret: MS_INVOICING }
          - { app: ms-support, secret: MS_SUPPORT }
          - { app: ms-audit, secret: MS_AUDIT }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: microservices
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_PREFIX }}-${{ matrix.app }}-${{ vars.AZURE_APP_SUFFIX }}
          publish-profile: ${{ secrets[format('AZURE_PUBLISH_{0}', matrix.secret)] }}
          package: microservices.zip
